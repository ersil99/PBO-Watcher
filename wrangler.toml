name = "pbo-watcher"
main = "worker.js"
compatibility_date = "2026-09-21"

[assets]
directory = "./dist"
binding = "ASSETS"

[[kv_namespaces]]
binding = "SOURCE_CONFIG"
id = "649d43712ad94d038ad832a7b55c863b"

[triggers]
crons = ["0 1,4,6,14,15 * * 1-5", "15 6 * * 1-5", "30,50 19-21 * * 1-5"]

[[queues.producers]]
binding = "NOTIFICATION_QUEUE"
queue = "pbo-watcher-notifications"

[[queues.consumers]]
queue = "pbo-watcher-notifications"
max_batch_size = 1
max_batch_timeout = 1
max_retries = 5
max_concurrency = 1